<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교육 일정 문의 · 김누리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:            #FFFFFF;
      --bg-alt:        #F6F7F9;
      --card:          #FFFFFF;
      --border:        #E4E6EA;
      --border-strong: #D5D8DE;
      --text-heading:  #1A1A35;
      --text-body:     #4A4E5A;
      --text-muted:    #8A8F98;
      --accent:        #E04E12;
      --accent-hover:  #C4430E;
      --accent-tint:   #FDEEE7;
      --navy:          #1A1A35;
      --busy-bg:       #F6F7F9;
      --busy-text:     #C0C3CC;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-body);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    a { text-decoration: none; color: inherit; }

    :focus:not(:focus-visible) { outline: none; }
    :focus-visible {
      outline: 2px solid var(--accent-hover);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px var(--accent-tint);
      border-radius: 4px;
    }

    /* ── NAV ── */
    nav {
      background: var(--navy);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1400px; margin: 0 auto; padding: 0 40px;
      height: 60px; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      color: #fff; transition: opacity .2s;
    }
    .nav-brand:hover { opacity: 0.85; }
    .nav-mark {
      width: 30px; height: 30px; background: var(--accent);
      border-radius: 7px; display: flex; align-items: center;
      justify-content: center; font-weight: 900; font-size: 15px; color: #fff;
      flex-shrink: 0;
    }
    .nav-brand-name { font-weight: 700; font-size: 15px; color: #fff; }
    .nav-right {
      display: flex; align-items: center; gap: 20px;
    }
    .nav-tagline {
      font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 400;
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: rgba(255,255,255,0.6);
      transition: color .2s; white-space: nowrap;
    }
    .nav-back:hover { color: #fff; }
    .nav-back svg { width: 14px; height: 14px; }

    /* ── HERO BAND ── */
    .page-hero {
      background: var(--navy);
      padding: 40px 0 44px;
    }
    .page-hero-inner {
      max-width: 1400px; margin: 0 auto; padding: 0 40px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap;
    }
    .page-hero h1 {
      font-size: 40px; font-weight: 800; color: #fff;
      letter-spacing: -1.2px; margin-bottom: 8px; line-height: 1.15;
    }
    .page-hero p {
      font-size: 16px; color: rgba(255,255,255,0.5); line-height: 1.6;
    }
    .page-hero .hint {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding-bottom: 4px;
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 15px; color: rgba(255,255,255,0.5);
    }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    }
    .legend-dot.available { background: var(--accent); }
    .legend-dot.busy { background: rgba(255,255,255,0.2); }
    .legend-dot.past { background: transparent; border: 1px solid rgba(255,255,255,0.2); }

    /* ── MAIN ── */
    .main { max-width: 1400px; margin: 0 auto; padding: 48px 40px 80px; }

    /* ── CALENDAR CONTROLS ── */
    .cal-controls {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .cal-month-label {
      font-size: 28px; font-weight: 700; color: var(--text-heading); letter-spacing: -0.5px;
    }
    .cal-nav { display: flex; gap: 8px; }
    .cal-nav-btn {
      width: 42px; height: 42px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-body);
      transition: border-color .2s, background .2s;
    }
    .cal-nav-btn:hover { border-color: var(--border-strong); background: var(--bg-alt); }
    .cal-nav-btn svg { width: 18px; height: 18px; }

    /* ── CALENDAR GRID ── */
    .cal-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
    .cal-header {
      display: grid; grid-template-columns: repeat(7, 1fr);
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
    }
    .cal-header-cell {
      text-align: center; padding: 16px 0;
      font-size: 13px; font-weight: 700; letter-spacing: 1px;
      color: var(--text-muted); text-transform: uppercase;
    }
    .cal-header-cell:first-child { color: #E04E12; }
    .cal-header-cell:last-child { color: #6B8CDA; }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
    }
    .cal-cell {
      min-height: 160px;
      padding: 14px 18px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: background .15s;
      min-width: 0;
      overflow: hidden;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell.empty {
      background: var(--bg-alt);
      opacity: 0.4;
    }
    .cal-cell.past {
      background: var(--bg);
      opacity: 0.45;
      cursor: default;
    }
    .cal-cell.past .cal-day { color: var(--text-muted); }

    /* Busy day */
    .cal-cell.busy {
      background: var(--bg-alt);
      cursor: default;
    }
    .cal-cell.busy .cal-day { color: var(--busy-text); }

    /* Busy day with time info — highlighted yellow card */
    .cal-cell.busy.has-time {
      background: #FEF9C3;
      border: 1px solid #FDE047;
    }
    .cal-cell.busy.has-time .cal-day { color: #78350F; }

    /* Schedule label pills */
    .cal-busy-label {
      font-size: 11px; font-weight: 600;
      margin-top: 4px; letter-spacing: .3px;
      display: block;
      padding: 2px 6px; border-radius: 4px;
      width: 100%; word-break: keep-all; line-height: 1.4;
    }
    .cal-busy-label.confirmed {
      background: var(--accent-tint);
      color: var(--accent-hover);
      border: 1px solid rgba(224,78,18,0.3);
    }
    .cal-busy-label.tentative {
      background: transparent;
      color: var(--text-muted);
      border: 1px dashed var(--border-strong);
    }
    .cal-event-block {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .cal-event-block:first-child {
      margin-top: 4px;
      padding-top: 0;
      border-top: none;
    }

    .cal-mode-badge {
      display: inline-block;
      font-size: 9px; font-weight: 700; letter-spacing: .4px;
      padding: 1px 5px; border-radius: 3px;
      margin-top: 3px; text-transform: uppercase;
    }
    .cal-mode-badge.online {
      background: #DBEAFE; color: #1D4ED8;
    }
    .cal-mode-badge.offline {
      background: #D1FAE5; color: #065F46;
    }

    .cal-time {
      font-size: 13px; font-weight: 700;
      color: var(--text-heading);
      margin-top: 4px; padding: 0 2px;
      line-height: 1.3;
    }

    /* Blocked day — no label, not clickable */
    .cal-cell.blocked {
      background: var(--bg-alt);
      cursor: not-allowed;
    }
    .cal-cell.blocked .cal-day { color: var(--busy-text); }

    /* Available day — clickable */
    .cal-cell.available {
      cursor: pointer;
    }
    .cal-cell.available:hover {
      background: var(--accent-tint);
    }
    .cal-cell.available:hover .cal-day { color: var(--accent); }
    .cal-cell.available:hover .cal-hover-hint { opacity: 1; }

    /* Today */
    .cal-cell.today .cal-day-wrap .cal-day {
      background: var(--navy);
      color: #fff;
      border-radius: 50%;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }

    .cal-day-wrap { display: flex; align-items: center; gap: 0; }
    .cal-day {
      font-size: 16px; font-weight: 600;
      color: var(--text-heading);
      line-height: 1;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-cell.sunday .cal-day { color: #E04E12; }
    .cal-cell.sunday.past .cal-day,
    .cal-cell.sunday.busy .cal-day { color: var(--busy-text); }
    .cal-cell.saturday .cal-day { color: #6B8CDA; }
    .cal-cell.saturday.past .cal-day,
    .cal-cell.saturday.busy .cal-day { color: var(--busy-text); }

    /* Holiday */
    .cal-cell.holiday .cal-day { color: #E04E12 !important; }
    .cal-cell.holiday.past .cal-day { color: var(--busy-text) !important; }
    .cal-holiday-name {
      font-size: 10px; font-weight: 600;
      color: #E04E12;
      margin-top: 3px;
      display: block;
      line-height: 1.3;
    }
    .cal-cell.past .cal-holiday-name { color: var(--busy-text); }

    .cal-hover-hint {
      opacity: 0;
      transition: opacity .15s;
      font-size: 12px; color: var(--accent-hover); font-weight: 600;
      margin-top: 8px; line-height: 1.3;
    }

    /* Events on a day */
    .cal-events { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
    .cal-event-pill {
      font-size: 10px; font-weight: 600;
      background: var(--navy); color: rgba(255,255,255,0.85);
      border-radius: 4px; padding: 2px 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }

    /* ── ASIDE NOTICE ── */
    .cal-notice {
      margin-top: 24px;
      padding: 20px 24px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .cal-notice-icon {
      width: 36px; height: 36px; flex-shrink: 0;
      background: var(--accent-tint); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-hover);
    }
    .cal-notice-icon svg { width: 17px; height: 17px; }
    .cal-notice-text { flex: 1; }
    .cal-notice-text strong { font-size: 15px; color: var(--text-heading); display: block; margin-bottom: 4px; }
    .cal-notice-text p { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
    .cal-notice-text a { color: var(--accent-hover); font-weight: 600; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(12px);
      background: var(--navy); color: #fff;
      padding: 12px 22px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      box-shadow: 0 4px 20px rgba(26,26,53,0.25);
      opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s;
      white-space: nowrap; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .nav-tagline { display: none; }
      .page-hero { padding: 36px 20px 40px; }
      .page-hero h1 { font-size: 32px; }
      .page-hero p { font-size: 16px; }
      .legend-item { font-size: 13px; }
      .main { padding: 32px 16px 60px; }
      .nav-inner { padding: 0 20px; }
      .cal-cell { min-height: 80px; padding: 8px 8px; }
      .cal-day { font-size: 13px; width: 26px; height: 26px; }
      .cal-hover-hint { display: none; }
      .cal-event-pill { display: none; }
      .cal-busy-label { font-size: 10px; }
      .cal-month-label { font-size: 22px; }
    }

    /* ── REVIEWS SECTION ── */
    .reviews-section {
      max-width: 1400px; margin: 0 auto; padding: 0 40px 80px;
    }
    .reviews-heading {
      font-size: 24px; font-weight: 800; color: var(--text-heading);
      letter-spacing: -0.5px; margin-bottom: 6px;
    }
    .reviews-sub {
      font-size: 14px; color: var(--text-muted); margin-bottom: 28px;
    }
    .reviews-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .review-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      transition: box-shadow .2s, transform .2s;
    }
    .review-card:hover {
      box-shadow: 0 8px 32px rgba(26,26,53,0.1);
      transform: translateY(-2px);
    }
    .review-photo {
      width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
    }
    .review-photo-placeholder {
      width: 100%; aspect-ratio: 16/9; background: var(--bg-alt);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: var(--text-muted);
    }
    .review-body { padding: 18px 20px; }
    .review-date {
      display: inline-block; font-size: 11px; font-weight: 700;
      color: var(--accent); background: var(--accent-tint);
      padding: 2px 8px; border-radius: 4px; margin-bottom: 8px;
    }
    .review-title {
      font-size: 15px; font-weight: 700; color: var(--text-heading); margin-bottom: 6px;
    }
    .review-comment {
      font-size: 13px; color: var(--text-body); line-height: 1.6;
    }
    .reviews-empty {
      text-align: center; padding: 48px; color: var(--text-muted); font-size: 14px;
      grid-column: 1 / -1;
    }
    @media (max-width: 600px) {
      .reviews-section { padding: 0 16px 60px; }
      .reviews-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  const EMAIL = 'nr@skilleat.com';
  const DAY_KO = ['일','월','화','수','목','금','토'];
  const MONTH_KO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  // Parse busy dates into a map: 'YYYY-MM-DD' → [{ label, status, startTime, endTime, mode }, ...]
  const busyMap = {};

  function addToBusyMap(dateStr, event) {
    if (!busyMap[dateStr]) busyMap[dateStr] = [];
    busyMap[dateStr].push(event);
  }

  // 하드코딩 배열 먼저 파싱
  BUSY_DATES.forEach(entry => {
    const parts = entry.split(':');
    // Format: 'YYYY-MM-DD:label:status' or 'YYYY-MM-DD:label:status:HH:MM:HH:MM:online/offline'
    const startTime = parts.length >= 5 ? parts[3] + ':' + parts[4] : '';
    const endTime   = parts.length >= 7 ? parts[5] + ':' + parts[6] : '';
    const mode      = parts.length >= 8 ? parts[7] : '';
    addToBusyMap(parts[0], {
      label:  parts[1] || '일정 있음',
      status: parts[2] || 'confirmed',
      startTime, endTime, mode
    });
  });

  // 관리자 페이지 localStorage 데이터가 있으면 덮어씀 (시간 포함)
  try {
    const saved = localStorage.getItem('sk_busy_dates');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) {
        Object.keys(busyMap).forEach(k => delete busyMap[k]);
        parsed.forEach(e => {
          addToBusyMap(e.date, {
            label:     e.label || '',
            status:    e.status || 'confirmed',
            startTime: e.startTime || '',
            endTime:   e.endTime || '',
            mode:      e.mode || ''
          });
        });
      }
    }
  } catch(e) {}

  let currentYear, currentMonth;

  function init() {
    const today = new Date();
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();
    render();
    updatePrevBtn();
  }

  function render() {
    const today = new Date();
    today.setHours(0,0,0,0);

    document.getElementById('monthLabel').textContent =
      `${currentYear}년 ${MONTH_KO[currentMonth]}`;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    // Empty leading cells
    for (let i = 0; i < firstDay; i++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell empty';
      grid.appendChild(cell);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(currentYear, currentMonth, d);
      date.setHours(0,0,0,0);
      const dow = date.getDay();
      const dateStr = formatDate(currentYear, currentMonth, d);

      const cell = document.createElement('div');
      const classes = ['cal-cell'];

      if (dow === 0) classes.push('sunday');
      if (dow === 6) classes.push('saturday');

      const holidayName = HOLIDAYS[dateStr] || null;
      if (holidayName) classes.push('holiday');

      const isPast = date < today;
      const isToday = date.getTime() === today.getTime();
      const busyEntries = busyMap[dateStr] || [];
      const hasEvents = busyEntries.length > 0 && busyEntries.some(e => e.status !== 'blocked');
      const isBusy = hasEvents && !isPast;
      const isBlocked = busyEntries.length > 0 && !isPast && busyEntries.every(e => e.status === 'blocked');

      if (isToday) classes.push('today');

      if (isPast) {
        classes.push('past');
      } else if (isBlocked) {
        classes.push('blocked');
      } else if (isBusy) {
        classes.push('busy');
      } else {
        classes.push('available');
      }

      cell.className = classes.join(' ');

      // Day number
      const dayWrap = document.createElement('div');
      dayWrap.className = 'cal-day-wrap';
      const dayEl = document.createElement('div');
      dayEl.className = 'cal-day';
      dayEl.textContent = d;
      dayWrap.appendChild(dayEl);
      cell.appendChild(dayWrap);

      // Holiday name label
      if (holidayName) {
        const holidayEl = document.createElement('span');
        holidayEl.className = 'cal-holiday-name';
        holidayEl.textContent = holidayName;
        cell.appendChild(holidayEl);
      }

      // Busy labels (blocked은 라벨 없음, 지난 날짜는 흐릿하게 표시)
      if (isBusy || (isPast && hasEvents)) {
        const visibleEntries = busyEntries.filter(e => e.status !== 'blocked');
        if (visibleEntries.length > 0 && !isPast) cell.classList.add('has-time');

        visibleEntries.forEach(({ label, status, startTime, endTime, mode }) => {
          const tipTime = (startTime && endTime) ? ` (${startTime}~${endTime})` : '';

          const eventWrap = document.createElement('div');
          eventWrap.className = 'cal-event-block';

          // 시간
          if (startTime || endTime) {
            const timeEl = document.createElement('div');
            timeEl.className = 'cal-time';
            if (startTime && endTime) {
              timeEl.innerHTML = `${startTime}-<br>${endTime}`;
            } else {
              timeEl.textContent = startTime ? `${startTime}~` : `~${endTime}`;
            }
            eventWrap.appendChild(timeEl);
          }

          // 온라인/오프라인 뱃지
          if (mode === 'online' || mode === 'offline') {
            const modeEl = document.createElement('div');
            modeEl.className = `cal-mode-badge ${mode}`;
            modeEl.textContent = mode === 'online' ? '온라인' : '오프라인';
            eventWrap.appendChild(modeEl);
          }

          // 라벨
          const busyLabel = document.createElement('div');
          busyLabel.className = `cal-busy-label ${status}`;
          busyLabel.textContent = status === 'tentative' ? `△ ${label}` : `● ${label}`;
          busyLabel.title = (status === 'tentative' ? '미확정' : '확정') + tipTime;
          eventWrap.appendChild(busyLabel);

          cell.appendChild(eventWrap);
        });
      }

      // Hover hint for available
      if (!isPast && !isBusy && !isBlocked) {
        const hint = document.createElement('div');
        hint.className = 'cal-hover-hint';
        hint.textContent = '문의 메일 보내기 →';
        cell.appendChild(hint);
      }

      // Click handler for available dates
      if (!isPast && !isBusy && !isBlocked) {
        cell.addEventListener('click', () => {
          const dayName = DAY_KO[dow];
          const label = `[교육 일정 문의] ${currentYear}년 ${currentMonth + 1}월 ${d}일 (${dayName})`;
          const subject = encodeURIComponent(label);
          window.location.href = `mailto:${EMAIL}?subject=${subject}`;
          showToast(`${currentMonth + 1}월 ${d}일(${dayName}) 날짜로 메일을 여는 중...`);
        });
        cell.setAttribute('role', 'button');
        cell.setAttribute('tabindex', '0');
        cell.setAttribute('aria-label', `${currentMonth + 1}월 ${d}일 교육 문의`);
        cell.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') cell.click();
        });
      }
      if (isBlocked) {
        cell.setAttribute('aria-disabled', 'true');
      }

      grid.appendChild(cell);
    }
  }

  function formatDate(y, m, d) {
    return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  }

  const MIN_YEAR = 2026, MIN_MONTH = 6; // 2026년 7월 (0-indexed)

  function updatePrevBtn() {
    const atMin = currentYear === MIN_YEAR && currentMonth <= MIN_MONTH;
    document.getElementById('prevBtn').disabled = atMin;
    document.getElementById('prevBtn').style.opacity = atMin ? '0.3' : '';
    document.getElementById('prevBtn').style.cursor = atMin ? 'default' : '';
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentYear === MIN_YEAR && currentMonth <= MIN_MONTH) return;
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    render();
    updatePrevBtn();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    render();
    updatePrevBtn();
  });

  init();

  // ── REVIEWS ──
  async function loadAndRenderReviews() {
    const grid = document.getElementById('reviewsGrid');
    try {
      const res = await fetch('https://raw.githubusercontent.com/skilleat-labs/nuri-kim-profile/main/reviews.json?t=' + Date.now());
      if (!res.ok) throw new Error();
      const reviews = await res.json();
      if (!reviews.length) {
        grid.innerHTML = '<div class="reviews-empty">아직 등록된 후기가 없습니다.</div>';
        return;
      }
      reviews.sort((a, b) => b.date.localeCompare(a.date));
      grid.innerHTML = reviews.map(r => `
        <div class="review-card">
          ${r.photo
            ? `<img class="review-photo" src="${r.photo}" alt="${r.title}" loading="lazy">`
            : `<div class="review-photo-placeholder">📷</div>`
          }
          <div class="review-body">
            <div class="review-date">${r.date}</div>
            <div class="review-title">${r.title}</div>
            ${r.comment ? `<div class="review-comment">${r.comment}</div>` : ''}
          </div>
        </div>
      `).join('');
    } catch {
      grid.innerHTML = '<div class="reviews-empty">후기를 불러오는 중 오류가 발생했습니다.</div>';
    }
  }
  loadAndRenderReviews();
