name: Sync Outlook Calendar

on:
  push:
    branches: [main]
    paths:
      - 'calendar.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Sync to Outlook
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_USER_EMAIL:    ${{ secrets.AZURE_USER_EMAIL }}
        run: python scripts/sync_outlook.py

      - name: Commit tracking file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/outlook_sync_ids.json
          git diff --staged --quiet || git commit -m "chore: update outlook sync tracking"
          git push
